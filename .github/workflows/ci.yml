name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: CSP and asset audit
        run: npm run lint

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -f dist/index.html ]; then echo "缺少 dist/index.html"; exit 1; fi
          if [ ! -f dist/js/bundle.min.js ]; then echo "缺少 dist/js/bundle.min.js"; exit 1; fi
          if [ ! -f dist/sw.js ]; then echo "缺少 dist/sw.js"; exit 1; fi
          echo "构建产物完整 ✓"

  e2e:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start dev server
        run: node scripts/dev-server.js 8000 > "$RUNNER_TEMP/site-server.log" 2>&1 &

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/site-server.log"
          exit 1

      - name: E2E smoke tests
        run: npx playwright test --config=test/e2e/playwright.config.js
